services:
  db:
    image: postgres:16-alpine
    container_name: pond_db
    environment:
      POSTGRES_USER: ponduser
      POSTGRES_PASSWORD: pondpassword
      POSTGRES_DB: pond_health
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponduser -d pond_health"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pond_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ponduser:pondpassword@db:5432/pond_health
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: pond_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
